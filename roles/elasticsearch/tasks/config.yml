---
# Config, heap, and the one-time keystore bootstrap password.
# `cluster.initial_master_nodes` must be set the FIRST time a cluster forms, then
# removed (leaving it risks a node re-bootstrapping a rival cluster after a restart). We
# track "already formed" with a marker file that service.yml creates once the cluster is
# green. The template below includes initial_master_nodes only while the marker is absent.
- name: Check if this node has already bootstrapped the cluster
  ansible.builtin.stat:
    path: /etc/elasticsearch/.cluster_bootstrapped
  register: es_bootstrap_marker # noqa: var-naming[no-role-prefix]

- name: Expose bootstrap state as a boolean
  ansible.builtin.set_fact:
    es_bootstrapped: "{{ es_bootstrap_marker.stat.exists }}" # noqa: var-naming[no-role-prefix]

- name: Ensure the ES keystore exists
  ansible.builtin.command:
    cmd: /usr/share/elasticsearch/bin/elasticsearch-keystore create
    creates: /etc/elasticsearch/elasticsearch.keystore

# `bootstrap.password` sets the `elastic` superuser password at first cluster formation.
# Only meaningful pre-bootstrap, so we set it once.
# `bootstrap.password` only takes effect at first cluster formation, so setting it
# gives us a KNOWN elastic password (from the vault) instead of the random one the
# installer generates. Guarded by `not es_bootstrapped` so it runs only on first boot.
- name: Read existing keystore settings
  ansible.builtin.command: /usr/share/elasticsearch/bin/elasticsearch-keystore list
  register: es_keystore_settings # noqa: var-naming[no-role-prefix]
  changed_when: false

- name: Seed the elastic bootstrap password (first bootstrap only)
  ansible.builtin.command:
    argv:
      - /usr/share/elasticsearch/bin/elasticsearch-keystore
      - add
      - --stdin
      - bootstrap.password
    stdin: "{{ vault_elastic_password }}"
    stdin_add_newline: false
  when:
    - not es_bootstrapped
    - "'bootstrap.password' not in es_keystore_settings.stdout_lines"
  # The `when` above is what actually makes this idempotent, but no-changed-when
  # is a static rule and only accepts changed_when/creates/removes. If this task
  # runs at all it has written a new keystore entry, so `true` is the honest answer.
  changed_when: true
  no_log: true

- name: Heap sizing
  ansible.builtin.copy:
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    content: "-Xms{{ es_heap }}\n-Xmx{{ es_heap }}\n"
    owner: root
    group: elasticsearch
    mode: "0640"
  notify: Restart elasticsearch

# mode is 0640, not the package default of 0660. Elasticsearch only READS this
# file (as the elasticsearch user, at node startup), and Ansible owns its content,
# so the group-write bit has no consumer here.
#
# Set 0660 if you ever add an Elasticsearch node via an ENROLLMENT TOKEN:
# `elasticsearch-reconfigure-node` rewrites elasticsearch.yml as the elasticsearch
# user and needs group write. Same for security auto-configuration, which we bypass.
# Flip it on the joining host for that run only, then put it back.
#
# NOTE: adding Kibana does NOT need this. Kibana enrollment writes kibana.yml,
# not this file -- it's kibana.yml that needs to be writable in that flow.
- name: Render elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0640"
  notify: Restart elasticsearch
