---
- name: Provision the Elasticsearch cluster + Kibana + Apache
  hosts: servers
  become: true
  roles:
    - role: common
      tags: [common, base]

    - role: wireguard
      tags: [wireguard, network]

    - role: elasticsearch
      tags: [elasticsearch, es, cluster]

    - role: kibana
      tags: [kibana]
      when: run_kibana | default(false)
